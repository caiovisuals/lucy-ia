name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Back-end tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Install dependencies
        run: pip install fastapi httpx pytest pytest-asyncio pydantic uvicorn

      - name: Run tests
        working-directory: back-end
        run: python -m pytest tests/ -v