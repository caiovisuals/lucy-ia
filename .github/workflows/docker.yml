name: Docker

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push back-end
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/back-end:latest
            ghcr.io/${{ github.repository }}/back-end:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push front-end
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/front-end:latest
            ghcr.io/${{ github.repository }}/front-end:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max